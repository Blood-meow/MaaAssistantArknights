name: Publish Core V2 Android Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release Pipeline run containing Android artifacts
        required: true
        type: string
      release_tag:
        description: Existing release tag to upload artifacts to
        required: true
        type: string
permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: MAAComponent-android-arm64
          path: release

      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: MAAComponent-android-x64
          path: release

      - name: Publish fixed Core V2 release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" release/*.tar.gz --clobber --repo "${{ github.repository }}"
